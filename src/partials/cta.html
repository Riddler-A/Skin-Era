<section class="cta" aria-labelledby="cta-titulo">
  <div class="container cta__inner" data-reveal>
    <h2 class="cta__title" id="cta-titulo">{{cta.title}}</h2>
    <p class="cta__text">{{cta.text}}</p>
    <div class="cta__actions">
      <a class="btn btn--light" href="{{base}}/servicios/">{{cta.primary}}</a>
      <a class="btn btn--outline-light" href="{{base}}/contacto/">{{cta.secondary}}</a>
    </div>
  </div>
</section>
