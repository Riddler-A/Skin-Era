<section class="about-story" id="historia" aria-labelledby="historia-titulo">
  <div class="container about-story__inner">
    <div data-reveal>
      <p class="eyebrow">{{about.story.eyebrow}}</p>
      <h2 class="about-story__title" id="historia-titulo">{{about.story.title}}</h2>
    </div>
    <div class="about-story__body" data-reveal>
      <p>{{about.story.p1}}</p>
      <p>{{about.story.p2}}</p>
      <blockquote class="about-story__quote">{{about.story.quote}}</blockquote>
    </div>
  </div>
</section>
