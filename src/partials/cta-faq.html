<section class="cta" aria-labelledby="cta-faq-titulo">
  <div class="container cta__inner" data-reveal>
    <h2 class="cta__title" id="cta-faq-titulo">{{faq.cta.title}}</h2>
    <p class="cta__text">{{faq.cta.text}}</p>
    <div class="cta__actions">
      <a class="btn btn--light" href="{{base}}/agendar/">{{faq.cta.primary}}</a>
      <a class="btn btn--outline-light" href="{{base}}/servicios/">{{faq.cta.secondary}}</a>
    </div>
  </div>
</section>
