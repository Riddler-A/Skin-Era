<section class="services-notes" aria-labelledby="notas-titulo">
  <div class="container services-notes__inner">
    <h2 class="services-notes__title" id="notas-titulo" data-reveal>{{services.notes.title}}</h2>
    <ul class="services-notes__list">
      <li data-reveal><h3>{{services.notes.items.age.title}}</h3><p>{{services.notes.items.age.text}}</p></li>
      <li data-reveal><h3>{{services.notes.items.retouch.title}}</h3><p>{{services.notes.items.retouch.text}}</p></li>
      <li data-reveal><h3>{{services.notes.items.skin.title}}</h3><p>{{services.notes.items.skin.text}}</p></li>
    </ul>
    <p class="services-notes__more" data-reveal>{{services.notes.more}}</p>
  </div>
</section>
