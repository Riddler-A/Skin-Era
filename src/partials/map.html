<section class="map" aria-labelledby="map-titulo">
  <div class="container">
    <h2 class="map__title" id="map-titulo">{{contact.map.title}}</h2>
    <p class="map__text">{{contact.map.text}}</p>
    <div class="map__frame">
      <iframe title="{{contact.map.iframeTitle}}" src="https://www.google.com/maps?q=Puerto+Vallarta,+Jalisco,+M%C3%A9xico&amp;z=12&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
    <a class="map__link" href="https://www.google.com/maps/search/?api=1&amp;query=Puerto+Vallarta%2C+Jalisco%2C+M%C3%A9xico" target="_blank" rel="noopener">{{contact.map.link}}</a>
  </div>
</section>
