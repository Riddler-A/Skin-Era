{{#if site.agendaUrl}}
<section class="agenda" id="calendario" aria-labelledby="agenda-titulo">
  <div class="container">
    <h2 class="agenda__title" id="agenda-titulo">{{contact.agenda.title}}</h2>
    <div class="agenda__frame">
      <iframe
        id="agenda-prisma"
        data-agenda
        data-origin="{{site.agendaOrigin}}"
        src="{{site.agendaUrl}}"
        title="{{contact.agenda.iframeTitle}}"
        style="width:100%;border:0;min-height:900px"
        loading="lazy"
      ></iframe>
    </div>
    <p class="agenda__fallback"><a href="{{site.agendaUrl}}" target="_blank" rel="noopener">{{contact.agenda.fallback}}</a></p>
  </div>
</section>
{{/if}}
