<!-- Calendario de citas. Permanece oculto hasta que /api/agenda responde bien
     (sin credenciales de Google Calendar el sitio muestra solo el formulario). -->
<section class="agenda" id="calendario" aria-labelledby="agenda-titulo" data-agenda data-api="/api/agenda" hidden>
  <div class="container">
    <h2 class="agenda__title" id="agenda-titulo">{{contact.agenda.title}}</h2>
    <p class="agenda__lead">{{contact.agenda.lead}}</p>

    <div class="agenda__panel">
      <div data-picker>
        <div class="agenda__nav" role="group" aria-label="{{contact.agenda.weekNav}}">
          <button class="agenda__arrow" type="button" data-prev aria-label="{{contact.agenda.prev}}">←</button>
          <p class="agenda__week" data-week-label aria-live="polite"></p>
          <button class="agenda__arrow" type="button" data-next aria-label="{{contact.agenda.next}}">→</button>
        </div>
        <p class="agenda__msg" data-msg>{{contact.agenda.loading}}</p>
        <div class="agenda__days" data-days></div>
      </div>

      <form class="agenda__form" data-agenda-form hidden novalidate>
        <p class="agenda__chosen" data-chosen></p>
        <div class="agenda__fields">
          <div class="field">
            <label for="a-nombre">{{contact.agenda.form.name}}</label>
            <input id="a-nombre" name="name" type="text" autocomplete="name" required minlength="2" maxlength="80">
          </div>
          <div class="field">
            <label for="a-telefono">{{contact.agenda.form.phone}}</label>
            <input id="a-telefono" name="phone" type="tel" inputmode="tel" autocomplete="tel" required pattern="[0-9+\(\)\-\s]{8,}" maxlength="30">
          </div>
          <div class="field">
            <label for="a-servicio">{{contact.agenda.form.service}}</label>
            <select id="a-servicio" name="service">
              <option value="">{{contact.agenda.form.serviceNone}}</option>
              {{#each services.items}}
              <option value="{{this.title}}" data-slug="{{this.slug}}">{{this.title}}</option>
              {{/each}}
            </select>
          </div>
          <div class="field field--wide">
            <label for="a-notas">{{contact.agenda.form.notes}}</label>
            <textarea id="a-notas" name="notes" rows="3" maxlength="1000"></textarea>
          </div>
        </div>
        <p class="sr-only"><label>{{contact.agenda.form.honeypot}} <input name="empresa" tabindex="-1" autocomplete="off"></label></p>
        <div class="agenda__actions">
          <button class="btn btn--primary" type="submit" data-submit>{{contact.agenda.form.submit}}</button>
          <button class="btn btn--ghost" type="button" data-change>{{contact.agenda.form.change}}</button>
        </div>
        <p class="agenda__status" role="status" aria-live="polite" data-agenda-status></p>
        <p class="agenda__privacy">{{contact.agenda.form.privacy}}</p>
      </form>

      <div class="agenda__done" data-done hidden role="status" tabindex="-1">
        <h3 class="agenda__done-title">{{contact.agenda.js.doneTitle}}</h3>
        <p data-done-text></p>
      </div>
    </div>
  </div>
  <script type="application/json" id="agenda-i18n">{{agendaI18n}}</script>
</section>
