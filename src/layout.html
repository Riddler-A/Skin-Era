<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.meta.title}}</title>
  <meta name="description" content="{{page.meta.description}}">
  <meta name="theme-color" content="#E8DEC5">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{page.meta.title}}">
  <meta property="og:description" content="{{page.meta.description}}">
  <meta property="og:url" content="{{site.url}}{{base}}/{{page.path}}">
  <meta property="og:locale" content="{{ogLocale}}">
  {{hreflangLinks}}
  <script>document.documentElement.classList.add("js")</script>
  <link rel="icon" type="image/png" href="/assets/img/logo-monograma-cafe.png">
  <link rel="preload" href="/assets/fonts/Giflika-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/LeagueSpartan-Variable.woff2" as="font" type="font/woff2" crossorigin>
  {{cssLinks}}
  {{jsonLd}}
</head>
<body>
  <a class="skip-link" href="#contenido">{{a11y.skip}}</a>
  {{> header}}
  <main id="contenido">
    {{sectionsHtml}}
  </main>
  {{> footer}}
  <button class="to-top" type="button" data-to-top hidden aria-label="{{a11y.top}}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
  </button>
  <script src="/js/main.js" defer></script>
  {{pageScripts}}
</body>
</html>
