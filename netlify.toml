[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# La página de contacto ahora es "Agendar"
[[redirects]]
  from = "/contacto/gracias"
  to = "/agendar/gracias/"
  status = 301

[[redirects]]
  from = "/contacto"
  to = "/agendar/"
  status = 301
  force = true
